[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nifi-readonly-mcp"
version = "0.1.0"
description = "MCP de solo lectura multi-servidor para Apache NiFi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DVB" }]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
nifi-readonly-mcp = "nifi_readonly_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nifi_readonly_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nifi_readonly_mcp",
    "config",
    "scripts",
    "tests",
    "README.md",
    "LIVE_VALIDATION_REPORT.md",
    ".env.example",
    "cursor-mcp.example.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "live: pruebas contra servidores NiFi reales (NIFI_MCP_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
