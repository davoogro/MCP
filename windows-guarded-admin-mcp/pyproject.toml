[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windows-guarded-admin-mcp"
version = "0.2.0"
description = "MCP server for Windows Server administration via PowerShell remoting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DVB" }]
dependencies = [
    "mcp>=1.28,<3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
windows-guarded-admin-mcp = "windows_guarded_admin_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_guarded_admin_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"powershell" = "windows_guarded_admin_mcp/powershell"
"authorized_scripts" = "windows_guarded_admin_mcp/authorized_scripts"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/config",
    "/powershell",
    "/authorized_scripts",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: live remote server tests (requires WSA_MCP_INTEGRATION=1)",
    "security: security-focused static or behavioral checks",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
