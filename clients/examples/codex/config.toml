# Pegar en ~/.codex/config.toml (o usar --install)

[mcp_servers.sqlserver-readonly]
command = "C:\\path\\to\\python.exe"
args = ["-m", "sqlserver_readonly_mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 300
[mcp_servers.sqlserver-readonly.env]
PYTHONPATH = "C:\\path\\to\\MCP\\sqlserver-readonly-mcp\\src"
PYTHONIOENCODING = "utf-8"
PYTHONUNBUFFERED = "1"

