# Pegar en ~/.codex/config.toml (o usar --install)

[mcp_servers.mssql]
command = "C:\\path\\to\\python.exe"
args = ["-m", "mssql_mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 300
[mcp_servers.mssql.env]
PYTHONPATH = "C:\\path\\to\\MCP\\mssql-mcp\\src"
PYTHONIOENCODING = "utf-8"
PYTHONUNBUFFERED = "1"

[mcp_servers.opt-mssql]
command = "C:\\path\\to\\python.exe"
