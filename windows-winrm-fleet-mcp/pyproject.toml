[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windows-winrm-fleet-mcp"
version = "1.0.0"
description = "Servidor MCP para administración de flota Windows Server (WinRM, sesiones persistentes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DVB" }]
dependencies = [
    "mcp>=2.0.0",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
windows-winrm-fleet-mcp = "windows_winrm_fleet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_winrm_fleet_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"
