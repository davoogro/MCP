[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windows-ssh-admin-mcp"
version = "1.0.0"
description = "MCP de administración (lectura y escritura) de Windows Server vía SSH + PowerShell"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DVB" }]
dependencies = ["mcp>=2.0.0"]

[project.scripts]
windows-ssh-admin-mcp = "windows_ssh_admin_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_ssh_admin_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"
