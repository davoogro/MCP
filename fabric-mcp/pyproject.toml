[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabric-mcp"
version = "3.0.0"
description = "MCP multi-conexión para Microsoft Fabric SQL (warehouses / SQL analytics endpoints)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DVB" }]
dependencies = [
    "mcp>=2.0.0",
    "pyodbc>=5.0.0",
    "python-dotenv>=1.0.0",
    "sqlparse>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
fabric-mcp = "fabric_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"
