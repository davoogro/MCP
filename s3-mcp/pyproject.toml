[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s3-mcp"
version = "1.0.0"
description = "Servidor MCP de solo lectura para explorar buckets de Amazon S3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DVB" }]
dependencies = [
    "mcp>=2.0.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "duckdb>=1.5",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8.0", "ruff>=0.4", "moto[s3]>=5", "pyarrow>=15"]

[project.scripts]
s3-mcp = "s3_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"
