[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssh-winserver-mcp"
version = "1.0.0"
description = "MCP de administración (lectura y escritura) de Windows Server vía SSH + PowerShell"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DVB" }]
dependencies = ["mcp>=2.0.0"]

[project.scripts]
ssh-winserver-mcp = "ssh_winserver_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ssh_winserver_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"
